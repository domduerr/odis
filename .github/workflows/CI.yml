# Tests every push, and publishes to crates.io when the version in Cargo.toml
# names a release that is not there yet. Bumping the version and pushing to main
# releases; any other push does not.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo clippy --all-targets -- -D warnings

  version:
    name: Is this version already on crates.io?
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.check.outputs.number }}
      unpublished: ${{ steps.check.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          number=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          # The sparse index is one line of JSON per published version.
          if curl -s "https://index.crates.io/od/is/odis" | grep -q "\"vers\":\"$number\""; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
            echo "::notice::odis $number is already on crates.io; nothing to publish."
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
            echo "::notice::odis $number is not on crates.io yet; it will be published."
          fi

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [test, version]
    # crates.io refuses to replace a version, so the check above is what keeps a
    # re-run from failing the workflow.
    if: ${{ needs.version.outputs.unpublished == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish ${{ needs.version.outputs.number }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
